name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      FDE_MNIST_DATA_DIR: ${{ github.workspace }}/data/mnist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Windows goldenと同じPyPI配布のtorchを使用する。
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check lint
        run: python -m ruff check . --output-format concise
      - name: Check formatting
        run: python -m ruff format --check . --output-format concise
      - name: Check types
        shell: pwsh
        run: |
          $qualityPython = python -c "import sys; print(sys.executable)"
          python -m pyright --pythonpath $qualityPython
          exit $LASTEXITCODE
      # MNISTは既存ローダーが初回取得し、goldenテストがハッシュを検査する。
      - name: Run all tests including golden regressions
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-results
          path: test-results.xml
          if-no-files-found: ignore
