name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      FDE_MNIST_DATA_DIR: ${{ github.workspace }}/data/mnist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Windows goldenと同じPyPI配布のtorchを使用する。
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check lint
        run: python -m ruff check . --output-format concise
      - name: Check formatting
        run: python -m ruff format --check . --output-format concise
      - name: Check types
        shell: pwsh
        run: |
          $qualityPython = python -c "import sys; print(sys.executable)"
          python -m pyright --pythonpath $qualityPython
          exit $LASTEXITCODE
      # 基準PCの数値goldenだけを除外し、それ以外の全テストは必須検査にする。
      - name: Run required tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest tests -q --ignore=tests/test_regression.py --ignore=tests/test_proposed_regression.py --junitxml=test-results.xml
      - name: Record hosted numerical environment
        run: python environments/golden/windows-cpu/capture.py --output-dir ci-golden-environment
      # ホストでは差が観測されたため診断扱い。基準ローカルの全回帰成功は別途必須。
      - name: Compare local numerical golden (diagnostic)
        id: numerical_golden
        continue-on-error: true
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest tests/test_regression.py tests/test_proposed_regression.py -q --junitxml=golden-diagnostic.xml
      - name: Report numerical golden diagnostic failure
        if: steps.numerical_golden.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output '::warning::Numerical golden comparison failed. Inspect diagnostic logs and the environment artifact. Local baseline verification remains required.'
          '## Numerical golden diagnostic failed' >> $env:GITHUB_STEP_SUMMARY
          'The hosted result differs from the local reference. See golden-diagnostic.xml and ci-golden-environment. A successful local full regression is still required before implementation changes are accepted.' >> $env:GITHUB_STEP_SUMMARY
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-results
          path: |
            test-results.xml
            golden-diagnostic.xml
            ci-golden-environment/
          if-no-files-found: ignore
